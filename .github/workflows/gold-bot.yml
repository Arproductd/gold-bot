name: Gold Bot

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
        run: python main.py

      - name: Commit price.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for f in price.json data.jsonl last_average.txt last_weekly.txt; do
            [ -f "$f" ] && git add "$f"
          done

          git diff --cached --quiet || (
            git commit -m "Update last price" &&
            git pull --rebase &&
            git push
          )