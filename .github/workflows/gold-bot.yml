name: Gold Bot

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
        run: php php/main.php

      - name: Commit price files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for f in php/price.json php/data.jsonl php/last_average.txt php/last_weekly.txt php/last_morning.txt; do
            [ -f "$f" ] && git add -f "$f"
          done

          git diff --cached --quiet || (
            git commit -m "Update last price" &&
            git pull --rebase &&
            git push
          )
