name: Private USD, AED and CNY rates

on:
  schedule:
    # GitHub cron runs in UTC. The delivery slot uses Tehran time and the Solar Hijri date.
    - cron: "30 3-19 * * *" # 07:00 through 23:00, every hour
    - cron: "45 7 * * *"   # 11:15
    - cron: "0 8-12 * * *" # 11:30 through 15:30, every hour
    - cron: "15 8 * * *"   # 11:45
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-bot-usd-cny
  cancel-in-progress: false

jobs:
  send-rate:
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl

      - name: Identify the Tehran delivery slot
        id: slot
        run: |
          key=$(php PHP/usd-cny.php --slot)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Check for delivery in this slot
        id: delivery
        if: steps.slot.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/usd-cny-sent
          key: usd-cny-sent-${{ steps.slot.outputs.key }}
          lookup-only: true

      - name: Send private rate
        if: steps.slot.outputs.key != '' && steps.delivery.outputs.cache-hit != 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USD_CNY_CHAT_ID: ${{ secrets.USD_CNY_CHAT_ID }}
          USD_CNY_SLOT: ${{ steps.slot.outputs.key }}
        run: |
          php PHP/usd-cny.php "$USD_CNY_SLOT"
          touch "$RUNNER_TEMP/usd-cny-sent"
